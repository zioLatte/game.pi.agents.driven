<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>ZIO LATTE! PIChan</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X9DYW1QWK2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-X9DYW1QWK2');
  </script>

  <link rel="stylesheet" href="css/game.css" id="game-css">
</head>

<body>
  <div id="gameover-overlay" role="dialog" aria-modal="true">
    <div id="gameover-box">
      <div>Game Over</div>
      <div id="gameover-score">Opinion: 0</div>
      <div id="gameover-time">Time: 0.0s</div>
      <div id="continue-info">
        <span class="continue-label">Continues:</span>
        <span id="continue-icons" aria-label="Continues remaining"></span>
      </div>
      <button id="continue-game" type="button">Continue</button>
      <button id="play-again" type="button">Play Again</button>
    </div>
  </div>
  <audio id="bgm" src="sounds/soundtrack.mp3" preload="auto" loop></audio>
  <audio id="gameover-sfx" src="sounds/gameover.mp3" preload="auto"></audio>
  <audio id="shot-sfx" src="sounds/pi.shot.mp3" preload="auto"></audio>
  <audio id="bounce-sfx" src="sounds/bullet.bounce.mp3" preload="auto"></audio>
  <audio id="onion-death-sfx" src="sounds/onion.death.mp3" preload="auto"></audio>
  <audio id="levelup-sfx" src="sounds/levelup.mp3" preload="auto"></audio>
  <div id="mobile-warning" role="dialog" aria-modal="true">
    Apri questo gioco da un PC.
  </div>
  <div id="motion-calibration-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div id="motion-calibration-box">
      <div id="motion-calibration-title">Calibrazione</div>
      <div id="motion-calibration-instructions">Tieni il telefono nella posizione comoda di gioco</div>
      <div id="motion-calibration-status" role="status" aria-live="polite">Calibrazione...</div>
      <button id="motion-calibration-ok" type="button" hidden>OK</button>
      <button id="motion-calibration-retry" type="button" hidden>Riprova</button>
    </div>
  </div>
  <div id="level-overlay" role="dialog" aria-modal="true">
    <div id="level-box">
      <div id="level-title">Level 1</div>
      <img id="level-onion" alt="" />
      <div id="level-info">Opinion: 0 | Time: 00:00:00</div>
    </div>
  </div>
  <div id="version-overlay" role="dialog" aria-modal="true">
    <div id="version-box">
      <div>Nuova versione disponibile</div>
      <div>Ricarico il gioco...</div>
      <button id="version-reload" type="button">Ricarica ora</button>
    </div>
  </div>
  <div id="loading-overlay" role="dialog" aria-modal="true">
    <div id="loading-box">
      <div id="loading-status"></div>
    </div>
  </div>
  <div id="goto-overlay" role="dialog" aria-modal="true">
    <div id="goto-panel">
      <div id="goto-header">
        <div id="goto-title">Goto Level</div>
        <button id="goto-close" type="button">Close</button>
      </div>
      <div id="goto-table-wrap">
        <table id="goto-table" aria-label="Levels Table">
          <thead>
            <tr>
              <th>Level</th>
              <th>Cycle</th>
              <th>Arena</th>
              <th>Bounces</th>
              <th>Onions</th>
              <th>Speed</th>
              <th>Chase</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="goto-controls">
        <input id="goto-input" type="number" min="1" placeholder="Level" />
        <button id="goto-apply" type="button">Go</button>
      </div>
    </div>
  </div>
  <div id="level-toast" class="level-toast" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true"></div>
  <div id="layout">
    <div id="game-wrap">
      <!-- MUST: dimensioni interne del canvas (vero buffer grafico) -->
      <canvas id="game" width="614" height="614"></canvas>
      <button id="arena-start-button" class="arena-start-button" type="button" aria-label="Play">
        <img id="arena-gameover-image" class="arena-gameover-image" src="assets/collage/gameover.png" alt="Game Over">
        <img id="arena-start-image" class="arena-play-image" src="assets/collage/play.png" alt="Play">
      </button>
    </div>
    <aside id="run-hud" class="run-hud" aria-label="Run status">
      <div class="run-hud__block run-hud__block--score" aria-label="Score">
        <img class="run-hud__icon" src="assets/collage/pickup_score_star.png" alt="">
        <strong id="run-hud-score" class="run-hud__value">0</strong>
      </div>

      <div class="run-hud__block run-hud__block--level" aria-label="Level">
        <img class="run-hud__icon" src="assets/collage/pickup_energy.png" alt="">
        <strong id="run-hud-level" class="run-hud__value">1</strong>
      </div>

      <div class="run-hud__block run-hud__block--lives" aria-label="Players remaining">
        <img class="run-hud__icon" src="assets/collage/player_idle.png" alt="">
        <strong id="run-hud-lives" class="run-hud__value">3</strong>
      </div>

      <button id="hud-restart" class="run-hud__restart" type="button" aria-label="Restart">
        <img class="run-hud__icon" src="assets/collage/restart.png" alt="">
      </button>
      <button id="hud-calibrate-motion" class="run-hud__calibrate" type="button" aria-label="Ricalibra motion">
        <img class="run-hud__icon" src="assets/collage/pickup_power.png" alt="">
      </button>
    </aside>
  </div>

  <!-- Mobile controls: touch fire only; movement is motion-only on smartphone. -->
  <div id="touch-controls" aria-hidden="true">
    <button id="touch-fire" type="button" aria-label="Spara">SPARA</button>
  </div>

  <script>
    window.BUILD_VERSION = "2026.05.24.11-remove-dpad";
    const loaderScript = document.createElement("script");
    loaderScript.type = "module";
    loaderScript.src = `js/loader.js?v=${encodeURIComponent(window.BUILD_VERSION)}`;
    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
